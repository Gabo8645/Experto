<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xperto - Servicio de Limpieza</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Xperto</h1>
    <p>Contrata tu servicio de limpieza en minutos</p>
  </header>

  <main>
    <section id="worldSelection">
      <h2>Selecciona el tipo de limpieza</h2>
      <div class="world-buttons">
        <button class="btn" onclick="selectWorld('basic')">🌍 Limpieza Básica</button>
        <button class="btn" onclick="selectWorld('deep')">🧼 Limpieza Profunda</button>
      </div>
    </section>

    <section id="expertSection" class="hidden">
      <h2>Selecciona tu Experto</h2>
      <div id="expertsContainer"></div>
      <button class="btn primary" onclick="goToAreas()">Siguiente</button>
    </section>

    <section id="areasSection" class="hidden">
      <h2>Selecciona las áreas y cantidad</h2>
      <div id="areasContainer"></div>
      <label for="schedule">¿Cuándo deseas el servicio?</label>
      <select id="schedule">
        <option value="inmediato">Inmediato</option>
        <option value="programado">Programar Fecha</option>
      </select>
      <input type="date" id="scheduleDate" class="hidden" />
      <button class="btn primary" onclick="calculateTotal()">Calcular Total</button>
    </section>

    <section id="summarySection" class="hidden card"></section>

    <section id="paymentSection" class="hidden card">
      <h2>Método de Pago</h2>
      <label><input type="radio" name="pay" value="tarjeta" /> Tarjeta de Crédito</label><br>
      <label><input type="radio" name="pay" value="efectivo" /> Efectivo</label><br>
      <button class="btn success" onclick="confirmService()">Confirmar y Pagar</button>
    </section>

    <section id="trackingSection" class="hidden card">
      <h2>Seguimiento del Servicio</h2>
      <p id="trackStatus">🕒 El experto va en camino...</p>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Xperto. Todos los derechos reservados.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
