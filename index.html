<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Contrata tu Servicio de Limpieza</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }
    h1, h2, h3 {
      color: #333;
    }
    .btn {
      background-color: #007bff;
      border: none;
      color: white;
      padding: 10px 20px;
      margin: 10px 0;
      cursor: pointer;
      border-radius: 5px;
    }
    .btn:disabled {
      background-color: #aaa;
      cursor: not-allowed;
    }
    .hidden {
      display: none;
    }
    .expert-card {
      display: flex;
      align-items: center;
      gap: 10px;
      background: white;
      border-radius: 8px;
      padding: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 10px;
    }
    .expert-photo {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
    }
    .stars {
      color: gold;
    }
    select {
      padding: 5px;
    }
    .summary, .payment, .tracking {
      background: white;
      padding: 15px;
      border-radius: 5px;
      margin-top: 15px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <h1>Elige tu Mundo de Limpieza</h1>
  <button class="btn" onclick="selectWorld('basic')">🌍 Limpieza Básica</button>
  <button class="btn" onclick="selectWorld('deep')">🧼 Limpieza Profunda</button>

  <div id="expertSection" class="hidden">
    <h2>Selecciona tu Experto</h2>
    <div id="expertsContainer"></div>
    <button class="btn" onclick="goToAreas()">Siguiente</button>
  </div>

  <div id="areasSection" class="hidden">
    <h2>Selecciona las áreas y cantidad</h2>
    <div id="areasContainer"></div>
    <label>¿Cuándo deseas el servicio?
      <select id="schedule">
        <option value="inmediato">Inmediato</option>
        <option value="programado">Programar Fecha</option>
      </select>
    </label>
    <input type="date" id="scheduleDate" class="hidden">
    <button class="btn" onclick="calculateTotal()">Calcular Total</button>
  </div>

  <div id="summarySection" class="hidden summary"></div>
  <div id="paymentSection" class="hidden payment">
    <h2>Método de Pago</h2>
    <label><input type="radio" name="pay" value="tarjeta"> Tarjeta de Crédito</label>
    <label><input type="radio" name="pay" value="efectivo"> Efectivo</label>
    <button class="btn" onclick="confirmService()">Confirmar y Pagar</button>
  </div>

  <div id="trackingSection" class="hidden tracking">
    <h2>Seguimiento del Servicio</h2>
    <p id="trackStatus">🕒 El experto va en camino...</p>
  </div>

  <script>
    const experts = [
      {
        id: 1,
        name: "Juan Pérez",
        stars: 4,
        comments: ["Muy puntual", "Excelente limpieza"],
        photo: "https://randomuser.me/api/portraits/men/32.jpg",
        specialty: "Limpieza de cocinas y salas"
      },
      {
        id: 2,
        name: "María Gómez",
        stars: 5,
        comments: ["Muy detallista", "Recomendadísima"],
        photo: "https://randomuser.me/api/portraits/women/45.jpg",
        specialty: "Limpieza profunda de baños"
      }
    ];

    const areas = ["Habitaciones", "Cocina", "Comedor", "Sala", "Terraza"];

    let selectedExpert = null;
    let selectedAreas = {};

    function selectWorld(world) {
      document.getElementById("expertSection").classList.remove("hidden");
      const container = document.getElementById("expertsContainer");
      container.innerHTML = "";
      experts.forEach(exp => {
        const card = document.createElement("div");
        card.className = "expert-card";
        card.innerHTML = `
          <img src="${exp.photo}" class="expert-photo">
          <div>
            <strong>${exp.name}</strong><br>
            <span class="stars">${"★".repeat(exp.stars)}${"☆".repeat(5 - exp.stars)}</span><br>
            <small>${exp.specialty}</small><br>
            <em>${exp.comments.join(" | ")}</em><br>
            <input type="radio" name="expert" value="${exp.id}"> Seleccionar
          </div>
        `;
        container.appendChild(card);
      });
    }

    function goToAreas() {
      const radios = document.querySelectorAll('input[name="expert"]');
      for (const r of radios) {
        if (r.checked) {
          selectedExpert = experts.find(e => e.id == r.value);
          break;
        }
      }
      if (!selectedExpert) {
        alert("Selecciona un experto");
        return;
      }
      document.getElementById("expertSection").classList.add("hidden");
      document.getElementById("areasSection").classList.remove("hidden");
      const container = document.getElementById("areasContainer");
      container.innerHTML = "";
      areas.forEach(area => {
        const div = document.createElement("div");
        const id = area.toLowerCase();
        div.innerHTML = `
          <label>${area}:
            <select id="area-${id}">
              <option value="0">0</option>
              ${[...Array(10)].map((_, i) => `<option value="${i+1}">${i+1}</option>`).join("")}
            </select>
          </label>
        `;
        container.appendChild(div);
      });

      const schedule = document.getElementById("schedule");
      schedule.addEventListener("change", () => {
        document.getElementById("scheduleDate").classList.toggle("hidden", schedule.value !== "programado");
      });
    }

    function calculateTotal() {
      let subtotal = 0;
      selectedAreas = {};
      areas.forEach(area => {
        const id = area.toLowerCase();
        const qty = parseInt(document.getElementById(`area-${id}`).value);
        if (qty > 0) {
          selectedAreas[area] = qty;
          subtotal += qty * 10; // precio fijo
        }
      });
      if (subtotal === 0) {
        alert("Selecciona al menos un área");
        return;
      }
      const commission = subtotal * 0.1;
      const total = subtotal + commission;
      const schedule = document.getElementById("schedule").value;
      const date = document.getElementById("scheduleDate").value;

      document.getElementById("areasSection").classList.add("hidden");
      const summary = document.getElementById("summarySection");
      summary.innerHTML = `
        <h2>Resumen del pedido</h2>
        <p><strong>Experto:</strong> ${selectedExpert.name}</p>
        ${Object.entries(selectedAreas).map(([k,v]) => `<p>${v} x ${k}</p>`).join("")}
        <p>Subtotal: $${subtotal.toFixed(2)}</p>
        <p>Comisión: $${commission.toFixed(2)}</p>
        <h3>Total: $${total.toFixed(2)}</h3>
        <p>Agendado: ${schedule === "programado" ? `para el ${date}` : "Inmediato"}</p>
      `;
      summary.classList.remove("hidden");
      document.getElementById("paymentSection").classList.remove("hidden");
    }

    function confirmService() {
      const payment = document.querySelector('input[name="pay"]:checked');
      if (!payment) {
        alert("Selecciona un método de pago");
        return;
      }
      document.getElementById("summarySection").classList.add("hidden");
      document.getElementById("paymentSection").classList.add("hidden");
      document.getElementById("trackingSection").classList.remove("hidden");

      // Simulación de tracking
      const status = document.getElementById("trackStatus");
      setTimeout(() => status.textContent = "✅ El experto ha llegado" , 3000);
      setTimeout(() => status.textContent = "🧹 El experto está limpiando..." , 6000);
      setTimeout(() => status.textContent = "🏁 Limpieza finalizada. ¡Gracias por confiar en nosotros!" , 9000);
    }
  </script>
</body>
</html>
